<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angélina · Créatrice UGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F3EA;
    --paper-2:#EFE1C8;
    --ink:#34281C;
    --wood:#6B4A2E;
    --terracotta:#C1633C;
    --fuchsia:#D6317A;
    --orange:#E2793D;
    --line:rgba(52,40,28,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; line-height:1.05; letter-spacing:-0.01em;}
  .eyebrow{
    font-size:0.75rem; text-transform:uppercase; letter-spacing:0.14em;
    color:var(--fuchsia); font-weight:600;
  }
  .script{font-family:'Caveat', cursive; color:var(--orange); font-weight:600;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 28px;}
  section{padding:96px 0;}
  @media(max-width:640px){ section{padding:64px 0;} }

  /* NAV */
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(247,242,231,0.9); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; flex-wrap:wrap; gap:10px 20px;}
  nav .logo{font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; white-space:nowrap;}
  nav .links{display:flex; gap:22px; font-size:0.85rem; font-weight:500; flex-wrap:wrap;}
  nav .links a{opacity:0.75; transition:opacity .2s, color .2s; white-space:nowrap;}
  nav .links a:hover{opacity:1; color:var(--fuchsia);}
  @media(max-width:640px){
    nav .wrap{flex-direction:column; align-items:flex-start; padding:14px 20px;}
    nav .links{gap:14px 18px; font-size:0.72rem; width:100%;}
  }

  /* HERO */
  .hero{padding:120px 0 80px; position:relative; overflow:hidden;}
  .hero .eyebrow{margin-bottom:18px;}
  .hero h1{font-size:clamp(2.4rem, 6vw, 4.2rem); max-width:14ch;}
  .hero h1 em{font-style:italic; color:var(--orange);}
  .hero p.lede{max-width:46ch; font-size:1.1rem; margin-top:22px; color:rgba(35,42,31,0.8);}
  .hero .ctas{display:flex; gap:14px; margin-top:34px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 24px; border-radius:100px; font-weight:600; font-size:0.9rem;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-primary{background:var(--wood); color:var(--paper);}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(51,71,46,0.3);}
  .btn-ghost{border:1.5px solid var(--ink); color:var(--ink); transition:transform .2s ease, border-color .2s ease, color .2s ease;}
  .btn-ghost:hover{transform:translateY(-2px); border-color:var(--orange); color:var(--orange);}

  .hero-mark{
    position:absolute; right:-60px; top:60px; width:260px; height:260px;
    border:1.5px solid var(--line); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-style:italic; font-size:0.95rem; color:var(--wood);
    text-align:center; padding:30px; opacity:0.85;
  }
  @media(max-width:900px){ .hero-mark{display:none;} }

  /* ABOUT */
  .about{border-top:1px solid var(--line); background:var(--paper-2);}
  .about .grid{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;}
  @media(max-width:760px){ .about .grid{grid-template-columns:1fr; gap:32px;} }
  .about h2{font-size:2rem; margin-bottom:20px;}
  .about p{color:rgba(35,42,31,0.82); margin-bottom:14px;}
  .facts{list-style:none; margin-top:24px;}
  .facts li{display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--line); font-size:0.92rem;}
  .facts li:last-child{border-bottom:1px solid var(--line);}
  .facts .label{color:var(--wood); font-weight:600; min-width:110px; flex-shrink:0;}

  /* PILLARS - corkboard */
  .pillars h2{font-size:2rem; margin-bottom:8px;}
  .pillars .eyebrow{margin-bottom:12px;}
  .pillars .sub{color:rgba(35,42,31,0.75); max-width:52ch; margin-bottom:52px;}
  .board{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px 22px;
  }
  @media(max-width:760px){ .board{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:460px){ .board{grid-template-columns:1fr;} }
  .card{
    background:#fff; border:1px solid var(--line); border-top:3px solid var(--fuchsia);
    padding:26px 20px 20px; border-radius:2px;
    box-shadow:0 6px 16px rgba(35,42,31,0.08);
    transition:transform .25s ease, box-shadow .25s ease;
    cursor:default;
  }
  .card:nth-child(even){border-top-color:var(--orange);}
  .card:nth-child(1){transform:rotate(-2deg);}
  .card:nth-child(2){transform:rotate(1.5deg);}
  .card:nth-child(3){transform:rotate(-1deg);}
  .card:nth-child(4){transform:rotate(2deg);}
  .card:nth-child(5){transform:rotate(-1.5deg);}
  .card:nth-child(6){transform:rotate(1deg);}
